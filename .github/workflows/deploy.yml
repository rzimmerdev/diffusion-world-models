name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # Important: fetches LFS pointers

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull  # Downloads actual LFS content

      - name: Verify _site exists
        run: |
          if [ ! -d "_site" ]; then
            echo "Error: _site directory not found! Build locally first."
            exit 1
          fi
          echo "Found _site directory with:"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
